name: build-pack

# Manual workflow: fetch -> build -> validate -> smoke -> (audit) -> pack -> (publish) voice packs.
# Never runs on pull_request. Only the `build` and `index` jobs hold `contents: write`, and the
# token is only handed to the steps that publish. No Apple / App Store Connect credentials exist
# in this repository; uploading Apple asset packs is a separate manual maintainer step.
#
# Action pinning: every third-party action is an official actions/* action, pinned to a commit
# SHA with the release in a trailing comment (checkout v7.0.1, setup-python v7.1.0,
# upload-artifact v7.0.2, download-artifact v8.0.2). Artifact names are unique per matrix id, so
# upload-artifact never has to overwrite; download-artifact uses pattern + merge-multiple.

on:
  workflow_dispatch:
    inputs:
      packs:
        description: "Comma-separated pack ids, or all-approved"
        required: true
        default: all-approved
        type: string
      audit:
        description: "Run the per-speaker acoustic audit (multi-speaker packs only)"
        required: true
        default: true
        type: boolean
      publish:
        description: "Publish GitHub Releases and update catalog/v1/index.json (main only)"
        required: true
        default: false
        type: boolean
      allow_unpinned:
        description: "Allow models whose sha256/bytes are not pinned in the registry"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-pack
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_packs: ${{ steps.plan.outputs.has_packs }}
    steps:
      - name: Publishing is only allowed from main
        if: ${{ inputs.publish && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::publish=true must be dispatched from the main branch"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: License gate and build matrix
        id: plan
        env:
          PACKS: ${{ inputs.packs }}
          ALLOW_UNPINNED: ${{ inputs.allow_unpinned }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          args=(--select "$PACKS" --matrix)
          if [ "$ALLOW_UNPINNED" != "true" ]; then args+=(--require-pinned); fi
          if [ "$PUBLISH" = "true" ]; then args+=(--for-publish); fi
          python -m readori_voicepack registry-check "${args[@]}" > matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          if [ "$(jq '.include | length' matrix.json)" -gt 0 ]; then has=true; else has=false; fi
          echo "has_packs=$has" >> "$GITHUB_OUTPUT"
          {
            echo "### Build plan"
            echo
            echo '```json'
            cat matrix.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: ${{ needs.plan.outputs.has_packs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write # only used by the "Publish GitHub Release" step
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PACK_ID: ${{ matrix.id }}
      UNPINNED_FLAG: ${{ inputs.allow_unpinned && '--allow-unpinned' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install (sherpa-onnx is pinned by the audio extra)
        run: python -m pip install -e ".[audio]"

      - name: Fetch upstream archive (bytes / sha256 checked)
        run: python -m readori_voicepack fetch "$PACK_ID" $UNPINNED_FLAG

      - name: Build pack directory
        run: python -m readori_voicepack build "$PACK_ID" $UNPINNED_FLAG

      - name: Validate (app importer rules)
        run: python -m readori_voicepack validate "build/packs/$PACK_ID"

      - name: Smoke synthesis
        run: python -m readori_voicepack smoke "build/packs/$PACK_ID"

      - name: Audit speakers
        if: ${{ inputs.audit }}
        run: python -m readori_voicepack audit "build/packs/$PACK_ID" --min-speakers 2

      - name: Validate again after audit
        if: ${{ inputs.audit }}
        run: python -m readori_voicepack validate "build/packs/$PACK_ID"

      - name: Pack (deterministic ZIP)
        run: |
          python -m readori_voicepack pack "build/packs/$PACK_ID" --out dist
          python -m readori_voicepack validate dist/*.zip
          {
            echo "### $PACK_ID"
            echo
            echo '```json'
            cat dist/*.zip.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pack artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pack-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload sidecar (used by the index job)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sidecar-${{ matrix.id }}
          path: dist/*.zip.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="$(jq -r '.packVersion' dist/*.zip.json)"
          SPDX="$(jq -r '.license.spdx // "see readori-attribution.txt"' dist/*.zip.json)"
          SHA="$(jq -r '.sha256' dist/*.zip.json)"
          TAG="pack/${PACK_ID}/v${VER}"
          NOTES="Readori offline voice pack ${PACK_ID} v${VER}. Model license: ${SPDX}. ZIP SHA-256: ${SHA}. Built by workflow run ${GITHUB_RUN_ID} from commit ${GITHUB_SHA}."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.zip.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.zip dist/*.zip.json \
              --repo "$GITHUB_REPOSITORY" \
              --title "${PACK_ID} v${VER}" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
          fi

  apple-asset-pack:
    # Draft Apple-hosted Background Assets packs. Needs Xcode 26 (`xcrun ba-package`); otherwise it
    # explains why it was skipped. continue-on-error: this job never fails the workflow.
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pack-*
          path: dist
          merge-multiple: true

      - name: Detect xcrun ba-package
        id: detect
        run: |
          if xcrun --find ba-package > /dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Apple asset packs skipped"
              echo
              echo "\`xcrun ba-package\` is not available on this runner (it ships with Xcode 26)."
              echo "The GitHub Release ZIPs are unaffected."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build draft asset packs
        if: ${{ steps.detect.outputs.available == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p ba-out work
          # Reference template from the installed tool: compare it with our generated manifests.
          xcrun ba-package template > ba-out/ba-package-template.json
          for zip in dist/*.zip; do
            id="$(basename "$zip" .zip)"
            rm -rf "work/$id"
            mkdir -p "work/$id"
            unzip -q "$zip" -d "work/$id"
            python -m readori_voicepack ba-manifest "work/$id" --out ba-out
          done
          for manifest in ba-out/*.manifest.json; do
            name="$(basename "$manifest" .manifest.json)"
            xcrun ba-package "$manifest" -o "ba-out/${name}.aar"
          done
          ls -l ba-out | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload draft asset packs
        if: ${{ steps.detect.outputs.available == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-asset-packs
          path: ba-out/*
          if-no-files-found: error
          retention-days: 14

  index:
    needs: build
    if: ${{ inputs.publish && needs.build.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # commit catalog/v1/index.json back to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true # needed to push the index commit

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sidecar-*
          path: sidecars
          merge-multiple: true

      - name: Update catalog/v1/index.json
        run: python -m readori_voicepack index --sidecars sidecars --repo "$GITHUB_REPOSITORY"

      - name: Commit index
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- catalog/v1/index.json; then
            echo "index.json unchanged"
          else
            git add catalog/v1/index.json
            git commit -m "catalog: update index.json (build-pack run ${GITHUB_RUN_ID})"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
