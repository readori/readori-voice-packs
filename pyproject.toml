[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readori-voicepack"
version = "0.1.0"
description = "Build, validate, audit and publish Readori offline voice packs (sherpa-onnx)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
audio = [
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "sherpa-onnx==1.13.6",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
readori-voicepack = "readori_voicepack.cli:main"

[tool.setuptools]
package-dir = { "" = "tools" }

[tool.setuptools.packages.find]
where = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]
ignore = ["E501"]  # long strings in messages are fine; no auto-formatter is enforced
